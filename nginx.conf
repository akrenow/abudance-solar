# nginx.conf
# Every page is pre-rendered to static HTML at build time (scripts/prerender.mjs):
#   /           -> index.html        /ar           -> ar.html
#   /about      -> about.html        /ar/about     -> ar/about.html
#   /products/solar-panels -> products/solar-panels.html
# Unknown URLs get a real 404 status with the 404 page in the right language.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/plain text/xml application/xml text/css application/javascript;

    # English has no language prefix: /en/... -> /...
    rewrite ^/en(?:/(.*))?$ /$1 permanent;

    # One URL per page: drop trailing slashes (except the home page)
    rewrite ^/(.+)/$ /$1 permanent;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    location /ar/ {
        try_files $uri $uri.html =404;
        error_page 404 /ar/404.html;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires max;
    }
}
